name: Build game (upstream nightly verbatim)

# 出「本体」：游戏二进制直接复制上游 nightly 官方包，一个字节都不重编。
# 只上传 Actions artifact，不发 GitHub Release。
#
# 2026-11-25：schedule 已停。上游 `horizon-rust/horizon` 整个组织 404，cron 每 30 分钟
# 只换来一次 404。改成只剩手动触发 —— 上游若回来，把下面那两行 schedule 取消注释即可。
on:
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 state，按当前上游 nightly 强制重建一次'
        type: boolean
        default: false

# Releases are written through the contents permission (there is no `releases` scope).
permissions:
  contents: write

concurrency:
  group: h-rust-release-game
  cancel-in-progress: false

jobs:
  monitor:
    name: Check upstream nightly
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      nightly_commit: ${{ steps.check.outputs.nightly_commit }}
      game_ref: ${{ steps.check.outputs.game_ref }}
      version_tag: ${{ steps.check.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with stored upstream version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            python3 tools/ci/monitor_upstream.py --state state/game.json --force
          else
            python3 tools/ci/monitor_upstream.py --state state/game.json
          fi

      - name: Commit the new state
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/game.json
          git commit -m "chore: track upstream game ${{ steps.check.outputs.version_tag }}"
          git pull --rebase origin main
          git push

  build:
    name: Copy official nightly package
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NIGHTLY_COMMIT: ${{ needs.monitor.outputs.nightly_commit }}
      VERSION_TAG: ${{ needs.monitor.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download official nightly package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Published under the upstream nightly name so the file says which build it is:
          #   horizon-linux-x86_64-<version_tag>.tar.gz
          # The upstream asset name stays the first argument of fetch-verified-asset.sh,
          # because that is what the release's SHA256SUMS is keyed by.
          ASSET="horizon-linux-x86_64-${VERSION_TAG}.tar.gz"
          bash tools/ci/fetch-verified-asset.sh horizon-linux-x86_64.tar.gz "$ASSET"
          ls -lh "$ASSET"

      - name: Verify nightly still matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/horizon-rust/horizon/releases/tags/nightly \
            | jq -r '.body' > upstream-nightly.txt
          grep -q "${NIGHTLY_COMMIT}" upstream-nightly.txt \
            || { echo '::error::upstream nightly moved during the build; retry next run'; exit 1; }

      - name: Publish the game package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One rolling release. The asset carries the upstream nightly name so a download
          # is self-describing:
          #   horizon-linux-x86_64-nightly-2026-11-20-0a875da.tar.gz
          # The bytes are the upstream file unchanged, so its sha256 still matches the
          # upstream release's own SHA256SUMS.
          TAG=nightly-game
          NAME="Horizon game (Linux x86_64, upstream nightly as published)"
          NOTE="Upstream nightly ${VERSION_TAG} (${NIGHTLY_COMMIT}), copied without rebuilding. Verifies against the upstream release's SHA256SUMS."
          ASSET="horizon-linux-x86_64-${VERSION_TAG}.tar.gz"

          # The name changes every nightly, so drop the previous asset instead of piling
          # up one file per run on the same release.
          for old in $(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null); do
            [[ "$old" == "$ASSET" ]] || gh release delete-asset "$TAG" "$old" --yes
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$NAME" \
              --notes "$NOTE" \
              --latest=false
          fi
          gh release edit "$TAG" --notes "$NOTE" --title "$NAME"

      - name: Keep the package as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-game-${{ env.VERSION_TAG }}
          path: horizon-linux-x86_64-${{ env.VERSION_TAG }}.tar.gz
          retention-days: 3
          if-no-files-found: error
