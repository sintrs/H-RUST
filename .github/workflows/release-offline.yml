name: Build offline (offline launcher + official game)

# 出「离线」包：离线名可在界面里改，单人、多人、LAN 都能用。
# - 游戏本体：官方 nightly 包**原样复制**，不编译
# - 启动器：从同一 nightly 的**上游源码**编译，然后打 offline-port.patch
# - 产物：滚动 Release `nightly-offline`（每次覆盖附件，名字带北京时间），另留一份 run artifact
#
# 2026-11-25：schedule 已停。上游 `horizon-rust/horizon` 整个组织 404，cron 每 35 分钟
# 只换来一次 `monitor failed: HTTP Error 404`。改成只剩手动触发 —— 上游若回来，把下面
# 那两行 schedule 取消注释即可恢复。试 Sunrise 的那条见 release-sunrise-offline.yml。
on:
  # schedule:
  #   - cron: '*/35 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 state，按当前上游 nightly 强制重建一次'
        type: boolean
        default: false

# Releases are written through the contents permission (there is no `releases` scope);
# gh release create/upload/edit all need it.
permissions:
  contents: write

concurrency:
  group: h-rust-release-offline
  cancel-in-progress: false

jobs:
  monitor:
    name: Check upstream nightly
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      nightly_commit: ${{ steps.check.outputs.nightly_commit }}
      version_tag: ${{ steps.check.outputs.version_tag }}
      launcher_version: ${{ steps.check.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with stored upstream version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            python3 tools/ci/monitor_upstream.py --state state/offline.json --force
          else
            python3 tools/ci/monitor_upstream.py --state state/offline.json
          fi

      - name: Commit the new state
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/offline.json
          git commit -m "chore: track upstream offline ${{ steps.check.outputs.version_tag }}"
          git pull --rebase origin main
          git push

  build:
    name: Build the offline package
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION_TAG: ${{ needs.monitor.outputs.version_tag }}
      NIGHTLY_COMMIT: ${{ needs.monitor.outputs.nightly_commit }}
      LAUNCHER_VERSION: ${{ needs.monitor.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install launcher build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev patchelf

      - name: Clone the pinned upstream source
        run: |
          set -euo pipefail
          git init -q src
          git -C src remote add origin https://github.com/horizon-rust/horizon.git
          git -C src fetch -q --depth 1 origin "${NIGHTLY_COMMIT}"
          git -C src checkout -q FETCH_HEAD
          echo "source HEAD: $(git -C src rev-parse HEAD)"

      - name: Port the offline account layer onto this source
        run: |
          set -euo pipefail
          git -C src apply --stat ../tools/ci/offline-port.patch
          git -C src apply ../tools/ci/offline-port.patch
          echo "offline-port.patch applied to $(git -C src rev-parse --short HEAD)"

      # A patch can apply cleanly onto an upstream change that quietly undoes it:
      # `git apply` only cares about the context lines, not about whether the offline
      # behaviour still holds. These are the upstream contracts the patch leans on, each
      # named so a failure says what moved instead of leaving a build that compiles and
      # then refuses every launch.
      - name: Check the upstream contracts the patch depends on
        run: python3 tools/ci/check-port-invariants.py src

      - name: Build the launcher
        env:
          HORIZON_GAME_BUILD_ID: ${{ needs.monitor.outputs.nightly_commit }}
        run: |
          set -euo pipefail
          bash tools/ci/build-linux.sh src dist launcher
          test -x dist/horizon-launcher || { echo '::error::launcher binary missing'; exit 1; }
          # Not `|| true`: a launcher that cannot even print its version is a broken package.
          dist/horizon-launcher --version

      - name: Download the official game package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o launcher.tar.gz \
            "https://github.com/horizon-rust/horizon/releases/download/${LAUNCHER_VERSION}/horizon-launcher-linux-x86_64.tar.gz"
          # The game package is the one that ends up shipped byte for byte, so it is the
          # one worth checking against the release's SHA256SUMS and GitHub's own digest.
          bash tools/ci/fetch-verified-asset.sh horizon-linux-x86_64.tar.gz game.tar.gz
          ls -lh launcher.tar.gz game.tar.gz dist/horizon-launcher

      - name: Verify nightly still matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/horizon-rust/horizon/releases/tags/nightly \
            | jq -r '.body' > upstream-nightly.txt
          grep -q "${NIGHTLY_COMMIT}" upstream-nightly.txt \
            || { echo '::error::upstream nightly moved during the build; retry next run'; exit 1; }

      # The packaged name carries the build time, so make-offline-package.sh writes the
      # path it just produced into $GITHUB_ENV for the steps below. (GITHUB_ENV does not
      # apply to the step that writes it, hence none of this is read here.)
      - name: Assemble the offline package
        run: |
          set -euo pipefail
          bash tools/ci/make-offline-package.sh \
            launcher.tar.gz game.tar.gz "${NIGHTLY_COMMIT}" package dist/horizon-launcher \
            "${VERSION_TAG}"

      # The binary that ships, unzipped and run for real. A patched build that compiles
      # but no longer opens the account gate, keeps an offline name, or installs its
      # bundled version would otherwise be found by the player, not here.
      - name: Smoke-test the packaged build
        env:
          SMOKE_TMPDIR: ${{ runner.temp }}/smoke
        run: |
          set -euo pipefail
          bash tools/ci/smoke-offline-package.sh "$PACKAGE_ASSET" "${VERSION_TAG}"

      - name: Write build info
        run: |
          set -euo pipefail
          {
            echo "version:    ${VERSION_TAG}"
            echo "upstream:   ${NIGHTLY_COMMIT}"
            echo "launcher:   built from that source + tools/ci/offline-port.patch"
            echo "game:       official nightly package, copied verbatim"
            echo "published:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Unzip, run ./horizon-launcher. The bundled build installs itself on first start."
            echo "Change the name in Settings -> Account -> Play offline."
          } > package/BUILD-INFO.txt

      - name: Publish the offline package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One rolling release, not one per nightly: the body says which build the asset
          # is, and every run replaces the asset. The repository page keeps two entries in
          # total instead of a hundred, and the old package is never a stale download.
          TAG=nightly-offline
          NAME="Horizon offline (Linux x86_64)"
          NOTE="Built from upstream nightly ${VERSION_TAG} (${NIGHTLY_COMMIT}). Game package copied verbatim; launcher compiled from the same source with the offline account patch."
          ASSET="$PACKAGE_ASSET"

          # The name carries the build time, so it changes every run: drop the previous
          # asset instead of piling up one file per nightly on the same release.
          for old in $(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null); do
            [[ "$old" == "$(basename "$ASSET")" ]] || gh release delete-asset "$TAG" "$old" --yes
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$NAME" \
              --notes "$NOTE" \
              --latest=false
          fi
          # Keep the description on the current build even when only the asset changed.
          gh release edit "$TAG" --notes "$NOTE" --title "$NAME"

      - name: Keep the package as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-offline-${{ env.VERSION_TAG }}
          path: package/
          retention-days: 3
          if-no-files-found: error
