name: Build a Sunrise native mod (manual)

# Native mods pin `[native] sunrise = <commit>`, so they can only be compiled
# against that exact build. The launcher does the compiling; this workflow just
# gives it a machine that is not the user's desktop.
on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: Sunrise build tag to compile against
        required: true
        default: dev-2026-11-24-3d34bbe
      mod_urls:
        description: Space separated .smod URLs, library mods first
        required: true
        default: >-
          https://github.com/EAnathos/sunrise-creatures/releases/download/creature/v0.3.5/creature-0.3.5.smod
          https://github.com/EAnathos/sunrise-creatures/releases/download/fireflies/v0.1.3/fireflies-0.1.3.smod
      launcher_tag:
        description: Launcher release tag
        required: true
        default: launcher@1.3.2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Shared runner IPs hit GitHub's anonymous rate limit; the launcher reads
      # this name to authenticate its release lookups.
      SUNRISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Runtime libraries the launcher links
        # A bare runner has no xkbcommon, and the launcher is an eframe binary
        # even when it only runs a CLI subcommand.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-x11-0 libxkbcommon0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 libgl1 libglx0 libegl1 \
            libfontconfig1 libfreetype6 libdbus-1-3 libasound2t64

      - name: Unpack the launcher
        run: |
          set -euo pipefail
          url="https://github.com/sunrise-org/sunrise/releases/download/${{ inputs.launcher_tag }}/sunrise-launcher-linux-x86_64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/launcher.tar.gz "$url"
          mkdir -p /tmp/lx
          tar -xzf /tmp/launcher.tar.gz -C /tmp/lx
          found=$(find /tmp/lx -name 'sunrise-launcher' -type f | head -1)
          chmod +x "$found"
          echo "LAUNCHER=$found" >> "$GITHUB_ENV"
          ldd "$found" | grep 'not found' || true
          "$found" --version

      - name: Install the build
        run: |
          set -euo pipefail
          "$LAUNCHER" install "${{ inputs.build_tag }}"
          ls -1 "$HOME/.local/share/sunrise/launcher/versions"

      - name: Fetch Minecraft 26.3 from Mojang
        # prepare wants a full install: version file, client jar, every library,
        # and the asset index with its objects. Mojang serves all of it without an
        # account, so the runner can have one.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures as cf
          import json, pathlib, urllib.request

          def get(url):
              for _ in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=180) as r:
                          return r.read()
                  except Exception:
                      pass
              raise SystemExit("failed: " + url)

          root = pathlib.Path.home() / ".minecraft"

          def save(item):
              url, rel = item
              path = root / rel
              if path.exists():
                  return 0
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(get(url))
              return 1

          man = json.loads(get("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"))
          entry = next(v for v in man["versions"] if v["id"] == "26.3")
          data = json.loads(get(entry["url"]))
          vdir = root / "versions" / "26.3"
          vdir.mkdir(parents=True, exist_ok=True)
          (vdir / "26.3.json").write_text(json.dumps(data))
          save((data["downloads"]["client"]["url"], "versions/26.3/26.3.jar"))

          pairs = []
          for lib in data.get("libraries", []):
              downloads = lib.get("downloads") or {}
              arts = [downloads.get("artifact")] + list((downloads.get("classifiers") or {}).values())
              for art in arts:
                  if art and art.get("path"):
                      pairs.append((art["url"], "libraries/" + art["path"]))

          ai = data["assetIndex"]
          (root / "assets" / "indexes").mkdir(parents=True, exist_ok=True)
          (root / "assets" / "indexes" / (ai["id"] + ".json")).write_bytes(get(ai["url"]))
          index = json.loads((root / "assets" / "indexes" / (ai["id"] + ".json")).read_text())
          for name, obj in index["objects"].items():
              h = obj["hash"]
              pairs.append(("https://resources.download.minecraft.net/" + h[:2] + "/" + h,
                            "assets/objects/" + h[:2] + "/" + h))

          with cf.ThreadPoolExecutor(max_workers=24) as ex:
              saved = sum(ex.map(save, pairs))
          print("files:", len(pairs), "downloaded:", saved)
          PY
          du -sh "$HOME/.minecraft"

      - name: Prepare the build from that install
        run: |
          set -euo pipefail
          "$LAUNCHER" prepare --version "${{ inputs.build_tag }}" --minecraft "$HOME/.minecraft" --json

      - name: Switch the profile to the build
        run: |
          set -euo pipefail
          "$LAUNCHER" switch "${{ inputs.build_tag }}" --json

      - name: Install the pinned Rust
        run: |
          set -euo pipefail
          "$LAUNCHER" rust install
          "$LAUNCHER" rust status

      - name: Install the mods into the profile
        run: |
          set -euo pipefail
          for slug in creature fireflies; do
            echo "=== $slug"
            "$LAUNCHER" mods install "$slug" --source sunrise --json || echo "FAILED $slug"
          done
          "$LAUNCHER" mods list || true

      - name: Compile
        run: |
          set -euo pipefail
          tag="${{ inputs.build_tag }}"
          ls -la "$HOME/.local/share/sunrise/game/sunrise-mods" 2>/dev/null || true
          "$LAUNCHER" native-build --version "$tag" --json || echo "FAILED"

      - name: Collect what came out
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          find "$HOME/.local/share/sunrise/game" "$HOME/.local/share/sunrise/launcher/native" \
            -type f \( -name '*.smod' -o -name '*.so' \) -print 2>/dev/null | tee /tmp/found.txt || true
          while read -r f; do
            mkdir -p "out/$(dirname "${f#$HOME/.local/share/sunrise/}")"
            cp -a "$f" "out/${f#$HOME/.local/share/sunrise/}"
          done < /tmp/found.txt
          if [ -d "$HOME/.local/share/sunrise/launcher/native" ]; then
            cp -a "$HOME/.local/share/sunrise/launcher/native/build.log" out/ 2>/dev/null || true
          fi
          du -sh out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mods-${{ inputs.build_tag }}
          path: out
          if-no-files-found: warn
          retention-days: 7
