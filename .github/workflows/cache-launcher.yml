name: Cache a launcher release

# 上游 sunrise-org/sunrise 的 launcher@X.Y.Z 附件是我们唯一的取件口：
# release-sunrise-native-pack.yml 直接下载它来跑 native-build。上游仓库整体消失的话，
# 连重新出包都做不到 —— 2026-11-25 horizon-rust 就是这么没的（组织整个 404）。
# 这条链把指定版本原样搬到本仓库的滚动 Release launcher-cache，留一个备用取件口。
#
# 为什么在 runner 上搬而不是本地：GitHub 没有服务端拷贝附件的接口，只能下下来再传上去；
# 本机到上游只有几十 KB/s，31 MB 要几十分钟，runner 上是秒级。
#
# 产物命名固定为 sunrise-launcher-<X.Y.Z>-linux-x86_64.tar.gz（去掉 @，方便拼 URL），
# 内容和上游字节一致，只改了文件名。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要备份的启动器 tag（上游 release tag，如 launcher@1.3.9）'
        type: string
        default: 'launcher@1.3.9'

concurrency:
  group: cache-launcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      RELEASE: launcher-cache
    steps:
      - name: Check the tag looks like a launcher release
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^launcher@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag 必须是 launcher@X.Y.Z，实际是 '$TAG'"
            exit 1
          fi
          version=${TAG#launcher@}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSET=sunrise-launcher-$version-linux-x86_64.tar.gz" >> "$GITHUB_ENV"

      # 上游文件名一直没变；如果哪天变了，这一步会 404 而不是悄悄搬错东西。
      - name: Download it from upstream
        run: |
          set -euo pipefail
          url="https://github.com/sunrise-org/sunrise/releases/download/$TAG/sunrise-launcher-linux-x86_64.tar.gz"
          echo "下载 $url"
          curl -fsSL --retry 3 --retry-delay 5 -o launcher.tar.gz "$url"
          size=$(stat -c %s launcher.tar.gz)
          echo "大小 $size bytes"
          # 正常的启动器包是 30 MB 上下；几百字节说明拿到的是错误页。
          if (( size < 20000000 )); then
            echo "::error::包只有 $size bytes，不像启动器压缩包"
            exit 1
          fi
          # 里面必须有 sunrise-launcher，否则搬过去也没用。
          # 先落成清单再匹配：直接 `tar | grep -q` 的话 grep 一命中就退出，tar 收到
          # SIGPIPE 报 write error，配着 pipefail 会把整条管道判失败。
          tar -tzf launcher.tar.gz > listing.txt
          grep -qxE '(.*/)?sunrise-launcher' listing.txt \
            || { echo "::error::压缩包里没有 sunrise-launcher"; exit 1; }
          echo "包内条目 $(wc -l < listing.txt) 个，启动器：$(grep -E '(.*/)?sunrise-launcher$' listing.txt | head -1)"
          sha256sum launcher.tar.gz | tee SHA256SUMS.txt

      - name: Upload it to this repository's rolling release
        run: |
          set -euo pipefail
          # 滚动 release：只存当前要留的版本，同名附件先删再传。
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            echo "release $RELEASE 已存在"
          else
            echo "创建 release $RELEASE"
            gh release create "$RELEASE" \
              --title "Cached launcher builds" \
              --notes "上游 sunrise-org/sunrise 的启动器附件备份，供 release-sunrise-native-pack.yml 在上游不可达时回落。文件按 \`sunrise-launcher-<版本>-linux-x86_64.tar.gz\` 命名，字节与上游一致，只改了名字。"
          fi
          for name in "$ASSET" "SHA256SUMS-$VERSION.txt"; do
            if gh release view "$RELEASE" --json assets -q '.assets[].name' | grep -qx "$name"; then
              echo "删掉同名旧附件 $name"
              gh release delete-asset "$RELEASE" "$name" -y
            fi
          done
          cp launcher.tar.gz "$ASSET"
          cp SHA256SUMS.txt "SHA256SUMS-$VERSION.txt"
          gh release upload "$RELEASE" "$ASSET" "SHA256SUMS-$VERSION.txt"
          echo "::notice::已备份 $TAG → $RELEASE/$ASSET"

      - name: Show what is in the release now
        run: gh release view "$RELEASE" --json assets -q '.assets[] | "\(.name)  \(.size) bytes"'
