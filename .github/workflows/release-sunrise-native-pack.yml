# 用官方启动器在 CI 里编译 Sunrise native mod，打成离线包，发到滚动 Release。
#
# 和 build-sunrise-native-mod.yml 的关系：那个是探针（只收集 .so，验证环境够不够），
# 这个是要发货的正式链。核心流程一样，区别是补全了打包、glibc 闸门和发布。
#
# 为什么跑在 ubuntu-22.04 而不是默认的 24.04：
#   launcher 二进制最高要 GLIBC_2.35，22.04 正好是 2.35；编出来的 .so 也链 2.35，
#   和官方本体一致。24.04 是 2.39，frontier 里的 atan2f 会被绑到更高版本节点，
#   包拿到老发行版上直接起不来 —— 这条是实测出来的，不是猜的。
#
# 为什么一个 job 里循环 build 而不是用 matrix：
#   真要下载 Minecraft 时它有 1.2 GB / 2 万多个文件，matrix 每个 job 都要拉一遍。
#   同一个 runner 里循环，只拉一次。
#
# 为什么默认不下载 Minecraft（game_files=none）：
#   native-build 只读 SDK 的 rmeta 和 mod 源码，一个字节都不读游戏资源；它唯一要的
#   是版本处于「prepared」状态。而那个判定只看 .local/sunrise-client/<mc>/
#   sunrise-prepare.json 里的 output_version（26 字节）。写对就过，于是 CI 能省掉
#   1.2 GB 的 Minecraft 下载和 694 MB 的 prepare 产物。产物包本来就不含资源，
#   所以两种模式打出来的包内容一致 —— 需要逐字节核对时把 game_files 设成 real。
#
# 为什么不用 `mods install` 而是按版本下载 .smod：
#   `mods install <slug>` 取的是最新 release，而 native mod 只在编译时 pin 的那个
#   build 上能用。要复现一个已知组合就得钉住 slug@version，见 fetch-sunrise-mods.py。
name: Build a Sunrise native mod pack

on:
  workflow_dispatch:
    inputs:
      builds:
        description: '要编的 build tag，空格或逗号分隔（每个都会单独出一个包）；留空 = 自动取最新能凑齐的'
        type: string
        default: ''
      mods:
        description: 'mod 列表，slug@version，空格分隔；留空 = 在这个 build 上取各 mod 的最高可用版本'
        type: string
        default: ''
      minecraft:
        description: '这些 build 对应的 Minecraft 版本'
        type: string
        default: '26.3'
      launcher_tag:
        description: '启动器 release tag（native-build 是它的子命令）；留空 = 自动取最新的 launcher@X.Y.Z'
        type: string
        default: ''
      game_files:
        description: '游戏文件：none = 不下载，只写 prepared 标记（省 1.9 GB）；real = 真下载 Minecraft 并 prepare'
        type: choice
        options:
          - none
          - real
        default: none
      publish:
        description: '发到滚动 Release sunrise-native（旧附件会被替换）'
        type: boolean
        default: true
      dry_run:
        description: '只查注册表和版本，不下载不编译'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: h-rust-sunrise-native-pack
  cancel-in-progress: false

jobs:
  build:
    name: Compile and pack
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # builds / mods 两个输入都可以留空 —— 留空就自己算「最新能凑齐的组合」：
      # 清单在 sunrise/native-mod-slugs.txt（和 watch 链同一份），plan-native-pack.py
      # 反求交集取最新 build，再在该 build 上给每个 mod 挑最高可用版本。所以手动
      # dispatch 什么都不填 = 永远出当下最新的可用包。
      # 填了就是复现已知组合：填 builds 只填一个、mods 留空，会问「这个 build 上各
      # mod 能用哪版」；两个都填就原样照编。放在装依赖之前，凑不齐能立刻红。
      - name: Resolve the build and mod set
        id: resolve
        env:
          IN_BUILDS: ${{ inputs.builds }}
          IN_MODS: ${{ inputs.mods }}
        run: |
          set -euo pipefail
          builds=$(printf '%s' "${IN_BUILDS//,/ }" | xargs)
          list=()
          if [[ -n "$builds" ]]; then read -ra list <<< "$builds"; fi

          if [[ -n "${IN_MODS// /}" ]]; then
            if ((${#list[@]} == 0)); then
              echo "::error::给了 mods 就得给 builds —— 版本号只对某个 build 成立"
              exit 1
            fi
            echo "::notice::用指定的组合：${builds} | ${IN_MODS}"
            echo "builds=$builds" >> "$GITHUB_OUTPUT"
            echo "mods=$IN_MODS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=0
          if ((${#list[@]} == 0)); then
            python3 sunrise/plan-native-pack.py \
              --slugs-file sunrise/native-mod-slugs.txt || code=$?
          elif ((${#list[@]} == 1)); then
            python3 sunrise/plan-native-pack.py --build "${list[0]}" \
              --slugs-file sunrise/native-mod-slugs.txt || code=$?
          else
            echo "::error::mods 留空时只能给一个 build（各 build 上能用的 mod 版本不同）；要一次编多个就把 mods 写全"
            exit 1
          fi
          if [[ $code -eq 2 ]]; then
            echo "::error::凑不齐：清单里的 mod 没有能同时使用的 build（或该 build 上缺版本）。把 mods 显式写全，或等作者发新版"
            exit 1
          elif [[ $code -ne 0 ]]; then
            echo "::error::plan-native-pack.py 退出码 $code"
            exit "$code"
          fi

      # launcher 是 eframe 程序，哪怕只跑 CLI 子命令也要 X11/Wayland 的符号；
      # 编译侧还要 -lasound -ludev，所以 dev 包一起装。
      # 注意 22.04 的包名是 libasound2，24.04 才叫 libasound2t64。
      - name: Install the libraries the launcher and the compiler need
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config binutils \
            libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libxkbcommon0 libwayland-client0 libx11-xcb1 \
            libxcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxcb-xinerama0 libgl1 libglx0 libegl1 libvulkan1 \
            libfontconfig1 libfreetype6 libdbus-1-3 libasound2 libudev1

      # 留空就取最新的 `launcher@X.Y.Z`。刻意查 sunrise-org/sunrise（下面真的去下载的那个
      # 仓库），不查 sunrise-org/sunrise-launcher：那边是 `vX.Y.Z` 的另一套 tag，两个仓库的
      # 同步有先后，混用会拼出 404 的 URL（11-26 的 watch 链就是这么错的）。
      - name: Resolve the launcher tag
        id: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ inputs.launcher_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$PINNED" ]]; then
            tag="$PINNED"
            echo "::notice::用指定的启动器：$tag"
          else
            tag=$(curl -fsSL --retry 3 \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/sunrise-org/sunrise/releases?per_page=100" \
                  | jq -r '[.[].tag_name | select(test("^launcher@[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[]' \
                  | sort -V | tail -1)
            if [[ -z "$tag" ]]; then
              echo "::error::上游 release 里找不到任何 launcher@X.Y.Z 的资产，无法自动取最新"
              exit 1
            fi
            echo "::notice::自动取最新启动器：$tag"
          fi
          echo "LAUNCHER_TAG=$tag" >> "$GITHUB_ENV"
          echo "launcher_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Unpack the official launcher
        run: |
          set -euo pipefail
          url="https://github.com/sunrise-org/sunrise/releases/download/$LAUNCHER_TAG/sunrise-launcher-linux-x86_64.tar.gz"
          echo "下载 $url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/launcher.tar.gz" "$url"
          mkdir -p "$RUNNER_TEMP/lx"
          tar -xzf "$RUNNER_TEMP/launcher.tar.gz" -C "$RUNNER_TEMP/lx"
          found=$(find "$RUNNER_TEMP/lx" -name 'sunrise-launcher' -type f | head -1)
          chmod +x "$found"
          echo "LAUNCHER_TGZ=$RUNNER_TEMP/launcher.tar.gz" >> "$GITHUB_ENV"
          echo "LAUNCHER=$found" >> "$GITHUB_ENV"
          ldd "$found" | grep 'not found' || true
          # 二进制是 stripped 的，版本串不在 strings 里，只有 --version 问得出来。
          # 存进 GITHUB_ENV，让打包脚本写进 BUILD-INFO.txt —— 否则包发出去以后
          # 没人能说出它是拿哪个启动器装的。留空自动取最新之前，这里是硬编码的
          # 默认值，1.3.5 那次就是「跑的不是默认值、产物又看不出来」。
          launcher_version=$("$found" --version)
          echo "$launcher_version"
          echo "LAUNCHER_VERSION=$launcher_version" >> "$GITHUB_ENV"

      # 只有 game_files=real 才需要 Minecraft：1.2 GB，缓存命中能省掉几分钟和几万次请求。
      - name: Cache the Minecraft install
        if: ${{ !inputs.dry_run && inputs.game_files == 'real' }}
        uses: actions/cache@v4
        with:
          path: ~/.minecraft
          key: minecraft-${{ inputs.minecraft }}-v1

      - name: Fetch Minecraft ${{ inputs.minecraft }} from Mojang
        if: ${{ !inputs.dry_run && inputs.game_files == 'real' }}
        run: |
          set -euo pipefail
          python3 sunrise/fetch-minecraft.py --version "${{ inputs.minecraft }}" --root "$HOME/.minecraft"

      - name: Fetch the mod sources at the pinned versions
        if: ${{ !inputs.dry_run }}
        env:
          MODS: ${{ steps.resolve.outputs.mods }}
          BUILDS: ${{ steps.resolve.outputs.builds }}
        run: |
          set -euo pipefail
          read -ra specs <<< "$(printf '%s' "$MODS" | tr ',' ' ')"
          python3 sunrise/fetch-sunrise-mods.py \
            --out "$RUNNER_TEMP/mods-src" \
            --manifest "$RUNNER_TEMP/mods-manifest.json" \
            --builds "$BUILDS" \
            "${specs[@]}"
          ls -1 "$RUNNER_TEMP/mods-src"

      - name: Compile and pack every requested build
        if: ${{ !inputs.dry_run }}
        # 单个 build 编译 + prepare 在本机是 53 s + 几十秒；CI 慢一些。给足余量，
        # 但别让一个卡住的 native-build 吃掉整个 job 的 150 分钟。
        timeout-minutes: 60
        env:
          BUILDS: ${{ steps.resolve.outputs.builds }}
          MC: ${{ inputs.minecraft }}
          GAME_FILES: ${{ inputs.game_files }}
        run: |
          set -uo pipefail
          VERSIONS="$HOME/.local/share/sunrise/launcher/versions"
          mkdir -p package "$VERSIONS"
          failed=()

          # native-build 判断「已 prepared」只看版本目录里那个 26 字节的标记文件，
          # 判定内容就是 output_version。版本号从这一版自己的 sunrise-prepare --check
          # 里问出来 —— 11-24 要 8、11-25 要 9，每版都不同，不能硬编码。
          # 必须精确匹配 "made by output version"，否则会先抓到 "prepared for
          # Minecraft unknown, this build needs 26.3" 里的 26。
          ask_output_version() {
            local tag=$1 res=$2
            "$VERSIONS/$tag/sunrise-prepare" --check --root "$VERSIONS/$tag" --output "$res" 2>&1 \
              | sed -n 's/.*made by output version [0-9][0-9]*, this build needs \([0-9][0-9]*\).*/\1/p' \
              | head -1
          }

          mark_prepared() {
            local tag=$1 res need
            res="$VERSIONS/$tag/.local/sunrise-client/$MC"
            mkdir -p "$res"
            # 只有标记文件时 --check 只说 "is not prepared"，不报版本号；补一份只带
            # minecraft 的空清单才会说 "this build needs N"。不写 schema：那个值会
            # 随 prepare 改版，写死反而变成新的过期源。
            printf '{"minecraft":"%s"}\n' "$MC" > "$res/sunrise-resources.json"
            printf '{"output_version":0}\n' > "$res/sunrise-prepare.json"
            need=$(ask_output_version "$tag" "$res")
            if [[ -z "$need" ]]; then
              echo "::error::问不出 $tag 需要的 output_version"
              "$VERSIONS/$tag/sunrise-prepare" --check --root "$VERSIONS/$tag" --output "$res" 2>&1 | head -8
              return 1
            fi
            printf '{"output_version":%s}\n' "$need" > "$res/sunrise-prepare.json"
            echo "prepared 标记：output_version=$need（未下载游戏文件）"
          }

          mapfile -t list < <(printf '%s' "${BUILDS//,/ }" | xargs -n1 2>/dev/null)
          if ((${#list[@]} == 0)); then
            echo "::error::没有 build 可编（Resolve 那步没给出 builds）"; exit 1
          fi
          echo "要编 ${#list[@]} 个 build：${list[*]}"
          for tag in "${list[@]}"; do
            echo "════════ $tag ════════"
            if ! "$LAUNCHER" install "$tag" --json; then
              echo "::error::install 失败：$tag"; failed+=("$tag"); continue
            fi
            if [[ "$GAME_FILES" = real ]]; then
              # prepare 每个 build 一次：它把资源写进版本目录自己的 .local/ 下。
              if ! "$LAUNCHER" prepare --version "$tag" --minecraft "$HOME/.minecraft" --json; then
                echo "::error::prepare 失败：$tag"; failed+=("$tag"); continue
              fi
            elif ! mark_prepared "$tag"; then
              echo "::error::写不了 prepared 标记：$tag"; failed+=("$tag"); continue
            fi
            if ! "$LAUNCHER" switch "$tag" --json; then
              echo "::error::switch 失败：$tag"; failed+=("$tag"); continue
            fi
            "$LAUNCHER" rust install
            "$LAUNCHER" rust status || true

            before=$(ls -1 "$VERSIONS" | sort)
            if ! "$LAUNCHER" native-build "$RUNNER_TEMP/mods-src" \
                   --version "$tag" --trust-native-code --json; then
              echo "::error::native-build 失败：$tag（mod 的 mixin 目标可能不在这个 build 里）"
              # CLI 只肯说 "The native build tool's output couldn't be verified"，
              # 真正的原因（哪个 mod、哪个符号）只在这个固定位置的日志里。
              ndir="$HOME/.local/share/sunrise/launcher/native"
              if [[ -f "$ndir/build.log" ]]; then
                echo "──── $ndir/build.log（$(wc -l < "$ndir/build.log") 行，尾 400）────"
                tail -400 "$ndir/build.log"
              else
                echo "::warning::没找到 $ndir/build.log"
              fi
              echo "──── $ndir 里有什么 ────"
              ls -la "$ndir" || true
              mkdir -p "$GITHUB_WORKSPACE/native-logs-$tag"
              cp -a "$ndir/." "$GITHUB_WORKSPACE/native-logs-$tag/" 2>/dev/null || true
              failed+=("$tag"); continue
            fi
            after=$(ls -1 "$VERSIONS" | sort)

            native=$(comm -13 <(echo "$before") <(echo "$after") | grep '^native-' | head -1 || true)
            if [[ -z "$native" ]]; then
              # 同名产物已存在时目录不会"新增"，按 base 短码兜底。
              short=${tag##*-}
              native=$(ls -1d "$VERSIONS"/native-"$short"-* 2>/dev/null | head -1 || true)
              [[ -n "$native" ]] && native=$(basename "$native")
            fi
            if [[ -z "$native" ]]; then
              echo "::error::$tag 编完了但找不到 native-* 产物目录"; failed+=("$tag"); continue
            fi
            echo "产物：$native"

            # 默认 MAX_GLIBC=2.35：任何一个 .so 超过就红，不发坏包。
            if ! bash sunrise/make-native-pack.sh "$VERSIONS/$native" "$LAUNCHER_TGZ" package; then
              echo "::error::打包失败：$tag"; failed+=("$tag"); continue
            fi
          done

          echo
          echo "=== 产物 ==="; ls -lh package/ || true
          if ((${#failed[@]})); then
            echo "::error::以下 build 没成功：${failed[*]}"
            exit 1
          fi

      - name: Check what the packages contain
        if: ${{ !inputs.dry_run && always() }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          assets=(package/*.tar.gz)
          if ((${#assets[@]} == 0)); then echo "没有产物可查"; exit 0; fi
          for a in "${assets[@]}"; do
            echo "── $(basename "$a")  $(du -h "$a" | cut -f1)"
            listing=$(tar -tzf "$a")
            # 这里必须用 here-string，不能用 `echo | grep -q`：pipefail 下 grep -q 一
            # 命中就关管道，echo 收到 SIGPIPE，整条管道返回 141，明明有也会判成没有。
            # 头一次就栽在这 —— 报「缺 .installed」，实际包里好好的。
            grep -qE '^\./data/versions/[^/]+/\.installed$' <<< "$listing" \
              && echo "   .installed 在" || echo "::error::缺 .installed"
            grep -qE '^\./data/versions/[^/]+/native-mods\.json$' <<< "$listing" \
              && echo "   native-mods.json 在" || echo "::error::缺 native-mods.json"
            grep -qE '^\./PLAY-OFFLINE\.sh$' <<< "$listing" \
              && echo "   PLAY-OFFLINE.sh 在" || echo "::error::缺 PLAY-OFFLINE.sh"
            if grep -q 'sunrise-data\.bin' <<< "$listing"; then
              echo "::warning::包里带上了 sunrise-data.bin（运行时缓存，不该进包）"
            fi
            tar -xzOf "$a" ./BUILD-INFO.txt 2>/dev/null | head -20 | sed 's/^/   /' || true
          done

      - name: Publish to the rolling release
        if: ${{ !inputs.dry_run && inputs.publish && success() }}
        run: |
          set -euo pipefail
          TAG=sunrise-native
          NAME="Sunrise native mod pack (Linux x86_64)"
          NOTE="Compiled in GitHub Actions (ubuntu-22.04, glibc 2.35) by the official launcher's own native-build. Every library is checked against native-mods.json and against a GLIBC_2.35 ceiling before it ships. Game files are not included: run ./run-offline.sh prepare once to build them from your own Minecraft."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$NAME" --notes "$NOTE" --latest=false --prerelease
          fi
          # 附件名带时间戳，--clobber 只覆盖同名文件，不先清就会一次堆一个包。
          # 这个 Release 的语义是「最新一版」，所以旧的直接删掉。
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r old; do
            [[ -n "$old" ]] || continue
            echo "删掉旧附件：$old"
            gh release delete-asset "$TAG" "$old" --yes
          done
          shopt -s nullglob
          for a in package/*.tar.gz; do
            gh release upload "$TAG" "$a" --clobber
          done
          gh release edit "$TAG" --notes "$NOTE" --title "$NAME"

      - name: Keep the packages as a run artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-native-packs
          path: package/
          retention-days: 7
          if-no-files-found: warn

      # 编译失败时日志比日志文件本身更重要：CLI 只有一句 couldn't be verified。
      - name: Upload the native build logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            native-build-*.log
            native-logs-*/
          retention-days: 7
          if-no-files-found: ignore
