name: Build minimap native mod

# 把 native mod 的编译搬到 Actions：产物是"编好的那几件"，下下来放进已有
# native-<commit>-<hash>/ 就能跑，不用在目标机上装 rust / SDK / 编译缓存。
#
# 编的方式不是复刻 rustc：用官方 launcher 的 `native-build` 子命令（上游 mod 仓库
# 自己的 validate.yml 也是这么编的），所以与启动器在本机编出来的是同一条代码路径。
on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'mod .so 的 sha256 与本机已知那版不一致时直接失败'
        type: boolean
        default: false
      mod_ref:
        description: 'mod 源（tag 或 commit）；默认 v0.7.9，其 [native] 已 pin 本次 nightly'
        default: v0.7.9
  push:
    paths:
      - tools/ci/build-native-mod.sh
      - .github/workflows/native-mod.yml

# Release 的写权限走 contents（没有 releases 这个 scope）。
permissions:
  contents: write

concurrency:
  group: h-rust-native-mod
  cancel-in-progress: false

jobs:
  build:
    name: native-build against nightly-2026-11-20
    runs-on: ubuntu-22.04   # glibc 2.35，与上游官方包同档；不要用 -latest
    timeout-minutes: 90
    env:
      MOD_REF: ${{ inputs.mod_ref || 'v0.7.9' }}
      NIGHTLY_TAG: nightly-2026-11-20
      LAUNCHER_TAG: launcher@0.2.107
      # 本机 native-0a875da-22680d1991ba 里 libminimap_...so 的 sha256
      EXPECTED_SHA256: 41700c17c172835647cfa7cd10b603023c9a4074c2035dbc2c93d21da2430db9
      STRICT: ${{ inputs.strict && '1' || '0' }}
      WORK: ${{ github.workspace }}/build/native-mod
    steps:
      - uses: actions/checkout@v4

      # 3.12 才有 tomllib：脚本读 horizon-mod.toml、mod 的 package.py 都要它。
      # 22.04 runner 自带的是 3.10，不指定会 ModuleNotFoundError。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: bash tools/ci/build-native-mod.sh dist-native

      - name: Show the record
        if: always()
        run: |
          set -uo pipefail
          cat dist-native/BUILD.txt 2>/dev/null || true
          echo '--- native-build 日志尾部 ---'
          tail -20 build/native-mod/native-build.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mod
          path: |
            dist-native/*.tar.gz
            dist-native/*.sha256
            dist-native/BUILD.txt
            build/native-mod/native-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish to the rolling release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=native-mod
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Minimap native mod' --prerelease \
              --notes '编好的 native mod（libminimap + libhorizon_patch + native-mods.json）。
          解压放进 versions/native-<commit>-<hash>/ 覆盖同名文件即可，不需要重新编译。'
          fi
          gh release upload "$TAG" dist-native/*.tar.gz dist-native/*.sha256 --clobber
