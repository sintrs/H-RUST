name: Build minimap native mod

# 把 native mod 的编译搬到 Actions：产物是**解压就能玩的离线包**
# （自编离线启动器 + 整个 native 版本目录），目标机不用装 rust / SDK / 编译缓存，
# 也不用跑安装脚本、不需要底座 nightly。
#
# 编的方式不是复刻 rustc：用官方 launcher 的 `native-build` 子命令（上游 mod 仓库
# 自己的 validate.yml 也是这么编的），所以与启动器在本机编出来的是同一条代码路径。
#
# 为什么要带那 330 MB 引擎 .so：native 版本目录 = 一个 nightly 的全套文件 + 该 commit
# 的 SDK 引擎库 + 编出来的 mod .so。只给后 8 MB 的话，目标机还得自己下 SDK 补齐。
on:
  workflow_dispatch:
    inputs:
      mod_ref:
        description: 'mod 源（tag 或 commit）；默认 v0.7.9，其 [native] 已 pin 本次 nightly'
        default: v0.7.9
      pin_commit:
        description: '把 mod 的 pin 改到这个上游 commit 再编（留空 = 用 mod 自己 pin 的）'
        default: ''
      pin_nightly:
        description: '该 commit 的安装版本名，如 nightly-2026-11-22-f1bb66f'
        default: ''
      install_tag:
        description: '装哪个 release tag；比带日期的 tag 更新的构建只在滚动 tag nightly 里'
        default: ''
  # 不挂 push 触发：这个 workflow 会替换 Release 附件，而 inputs 的默认值指向旧的
  # nightly（v0.7.9 + 0a875da），改脚本时自动跑一次就会把当前可用的包换掉。
  # 要重编就手动 dispatch，把 pin_commit / pin_nightly 填对。

# Release 的写权限走 contents（没有 releases 这个 scope）。
permissions:
  contents: write

concurrency:
  group: h-rust-native-mod
  cancel-in-progress: false

jobs:
  build:
    name: native-build the full version folder
    runs-on: ubuntu-22.04   # glibc 2.35，与上游官方包同档；不要用 -latest
    timeout-minutes: 90
    env:
      MOD_REF: ${{ inputs.mod_ref || 'v0.7.9' }}
      PIN_COMMIT: ${{ inputs.pin_commit }}
      PIN_NIGHTLY: ${{ inputs.pin_nightly }}
      INSTALL_TAG: ${{ inputs.install_tag }}
      NIGHTLY_TAG: nightly-2026-11-20
      LAUNCHER_TAG: launcher@0.2.107
      WORK: ${{ github.workspace }}/build/native-mod
    steps:
      - uses: actions/checkout@v4

      # 3.12 才有 tomllib：脚本读 horizon-mod.toml、mod 的 package.py 都要它。
      # 22.04 runner 自带的是 3.10，不指定会 ModuleNotFoundError。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # native-build 会用启动器自带的 rust 编 wgpu/winits 那一套，它们要 ALSA 与 udev 的头文件；
      # runner 镜像里只有运行库，没有 -dev。缺了会在第 8 步直接报 "this computer lacks them"。
      - name: System libraries the build links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libasound2-dev libudev-dev pkg-config

      - name: Build
        env:
          # 第 10 步要下载滚动 Release 里那份自编离线启动器（不在这里编，省 30 分钟）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/build-native-mod.sh dist-native

      - name: Show the record
        if: always()
        run: |
          set -uo pipefail
          cat dist-native/pkg/BUILD.txt 2>/dev/null || true
          echo '--- native-build 日志尾部 ---'
          tail -20 build/native-mod/native-build.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-full
          path: |
            dist-native/*.tar.gz
            dist-native/*.sha256
            dist-native/pkg/BUILD.txt
            dist-native/pkg/manifest.json
            build/native-mod/native-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish to the rolling release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=native-mod
          NOTES='解压就能玩：horizon-launcher + 整个 native 版本目录（含小地图 mod），
          没有安装脚本、不需要底座 nightly、不需要编译。首启会自动复制进启动器数据目录并选中。'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Horizon offline + minimap (unpack and play)' \
              --prerelease --notes "$NOTES"
          else
            gh release edit "$TAG" --title 'Horizon offline + minimap (unpack and play)' --notes "$NOTES"
          fi
          # 包名每次带日期短码都变。先传新的、再删旧的：上传失败时旧包还在，
          # 不会出现「Release 里一个附件都没有」的空窗。
          OFFLINE=$(find dist-native -maxdepth 1 -name 'horizon-linux-x86_64-native-offline-*.tar.gz' | head -1)
          FILES=()
          if [ -n "$OFFLINE" ]; then
            FILES=("$OFFLINE" "$OFFLINE.sha256")
          else
            for f in dist-native/*.tar.gz dist-native/*.sha256; do FILES+=("$f"); done
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
          while read -r name; do
            [ -n "$name" ] || continue
            keep=0
            for f in "${FILES[@]}"; do [ "$(basename "$f")" = "$name" ] && keep=1; done
            [ "$keep" = 1 ] || gh release delete-asset "$TAG" "$name" -y >/dev/null 2>&1 || true
          done < <(gh release view "$TAG" --json assets -q '.assets[].name')
          if [ -n "$OFFLINE" ]; then
            echo "已发布离线包：$(basename "$OFFLINE")"
          else
            echo "只有增量包（这次没取到自编离线启动器）" >&2
          fi
