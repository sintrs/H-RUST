name: Build minimap native mod

# 把 native mod 的编译搬到 Actions：产物是**完整可用的 native 版本增量**，
# 下下来解开跑 install-native-build.sh 就能玩，目标机不用装 rust / SDK / 编译缓存。
#
# 编的方式不是复刻 rustc：用官方 launcher 的 `native-build` 子命令（上游 mod 仓库
# 自己的 validate.yml 也是这么编的），所以与启动器在本机编出来的是同一条代码路径。
#
# 为什么要带那 330 MB 引擎 .so：native 版本目录 = 一个 nightly 的全套文件 + 该 commit
# 的 SDK 引擎库 + 编出来的 mod .so。只给后 8 MB 的话，目标机还得自己下 SDK 补齐。
on:
  workflow_dispatch:
    inputs:
      mod_ref:
        description: 'mod 源（tag 或 commit）；默认 v0.7.9，其 [native] 已 pin 本次 nightly'
        default: v0.7.9
      pin_commit:
        description: '把 mod 的 pin 改到这个上游 commit 再编（留空 = 用 mod 自己 pin 的）'
        default: ''
      pin_nightly:
        description: '该 commit 的安装版本名，如 nightly-2026-11-22-f1bb66f'
        default: ''
      install_tag:
        description: '装哪个 release tag；比带日期的 tag 更新的构建只在滚动 tag nightly 里'
        default: ''
  push:
    paths:
      - tools/ci/build-native-mod.sh
      - .github/workflows/native-mod.yml

# Release 的写权限走 contents（没有 releases 这个 scope）。
permissions:
  contents: write

concurrency:
  group: h-rust-native-mod
  cancel-in-progress: false

jobs:
  build:
    name: native-build the full version folder
    runs-on: ubuntu-22.04   # glibc 2.35，与上游官方包同档；不要用 -latest
    timeout-minutes: 90
    env:
      MOD_REF: ${{ inputs.mod_ref || 'v0.7.9' }}
      PIN_COMMIT: ${{ inputs.pin_commit }}
      PIN_NIGHTLY: ${{ inputs.pin_nightly }}
      INSTALL_TAG: ${{ inputs.install_tag }}
      NIGHTLY_TAG: nightly-2026-11-20
      LAUNCHER_TAG: launcher@0.2.107
      WORK: ${{ github.workspace }}/build/native-mod
    steps:
      - uses: actions/checkout@v4

      # 3.12 才有 tomllib：脚本读 horizon-mod.toml、mod 的 package.py 都要它。
      # 22.04 runner 自带的是 3.10，不指定会 ModuleNotFoundError。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # native-build 会用启动器自带的 rust 编 wgpu/winits 那一套，它们要 ALSA 与 udev 的头文件；
      # runner 镜像里只有运行库，没有 -dev。缺了会在第 8 步直接报 "this computer lacks them"。
      - name: System libraries the build links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libasound2-dev libudev-dev pkg-config

      - name: Build
        run: bash tools/ci/build-native-mod.sh dist-native

      - name: Show the record
        if: always()
        run: |
          set -uo pipefail
          cat dist-native/pkg/BUILD.txt 2>/dev/null || true
          echo '--- native-build 日志尾部 ---'
          tail -20 build/native-mod/native-build.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-full
          path: |
            dist-native/*.tar.gz
            dist-native/*.sha256
            dist-native/pkg/BUILD.txt
            dist-native/pkg/manifest.json
            build/native-mod/native-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish to the rolling release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=native-mod
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Minimap native mod (full build)' --prerelease \
              --notes '完整的 native 版本增量：编出来的两个 .so + 该 commit 的 SDK 引擎库 + mod 源码副本。
          解开 → bash install-native-build.sh → 把实例切到新版本，不需要下载 SDK，也不需要编译。'
          fi
          # 包名每次带日期短码都变，先清掉上一轮的附件，让这个 Release 恒一个包。
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r name; do
            [ -n "$name" ] && gh release delete-asset "$TAG" "$name" -y >/dev/null 2>&1 || true
          done
          gh release upload "$TAG" dist-native/*.tar.gz dist-native/*.sha256 --clobber
